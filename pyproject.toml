[tool.ruff]
line-length = 88
target-version = "py313"
extend-exclude = ["custom_components/catalog_editor/catalog_pack.py", "custom_components/catalog_editor/catalog_runtime.py", "custom_components/catalog_editor/catalog_rules.py", "custom_components/catalog_editor/catalog_conversion.py"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["custom_components"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.coverage.run]
omit = [
  "*/catalog_pack.py",
  "*/catalog_runtime.py",
  "*/catalog_rules.py",
  "*/catalog_conversion.py",
]
