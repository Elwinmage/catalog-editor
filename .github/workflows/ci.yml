name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: pip install -r requirements.txt pyright
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Types
        run: pyright custom_components/catalog_editor tests
      - name: Tests
        run: pytest --cov=custom_components --cov-report=term-missing --cov-fail-under=100

  card:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install jsdom
        run: npm install --no-audit --no-fund
        working-directory: tests/js
      - name: Syntax
        run: node --check custom_components/catalog_editor/frontend/catalog-editor-card.js
      - name: Card tests
        run: node --test
        working-directory: tests/js
